<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รักใบข้าวนะครับ💝</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #fff0f3;
    font-family: 'Lato', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Floating hearts background */
  .hearts-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .heart-float {
    position: absolute;
    bottom: -60px;
    font-size: 24px;
    animation: floatUp linear infinite;
    opacity: 0;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
  }

  /* Main card */
  .card {
    position: relative;
    z-index: 1;
    background: #fff;
    border-radius: 32px;
    padding: 48px 52px;
    max-width: 520px;
    width: 90vw;
    text-align: center;
    box-shadow: 0 20px 60px rgba(220,50,80,0.15);
    border: 1.5px solid #ffd6de;
  }

  .bear-icon {
    font-size: 72px;
    display: block;
    margin-bottom: 16px;
    animation: bounce 1.8s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-10px); }
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: #c0394b;
    margin-bottom: 8px;
    line-height: 1.2;
  }

  .subtitle {
    color: #e07080;
    font-size: 1rem;
    font-weight: 300;
    margin-bottom: 28px;
    letter-spacing: 0.04em;
  }

  .message-box {
    background: #fff8f9;
    border: 1.5px solid #ffd6de;
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 32px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #a03050;
    font-size: 1.05rem;
    line-height: 1.7;
    min-height: 60px;
  }

  /* Buttons */
  .btn-group {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .btn-yes {
    background: #e83a5a;
    color: white;
    border: none;
    padding: 14px 36px;
    border-radius: 50px;
    font-size: 1.1rem;
    font-family: 'Lato', sans-serif;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 20px rgba(232,58,90,0.35);
    letter-spacing: 0.03em;
  }
  .btn-yes:hover {
    transform: scale(1.07);
    box-shadow: 0 10px 28px rgba(232,58,90,0.45);
  }

  .btn-no {
    background: transparent;
    color: #c0394b;
    border: 1.5px solid #ffc0cb;
    padding: 14px 36px;
    border-radius: 50px;
    font-size: 1.1rem;
    font-family: 'Lato', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .btn-no:hover { background: #fff0f3; }

  /* Response message */
  .response-msg {
    display: none;
    margin-top: 20px;
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: #c0394b;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Burst effect */
  .burst { font-size: 1.8rem; animation: spin 0.6s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 100;
    animation: confettiFall 2.5s linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- Floating hearts bg -->
<div class="hearts-bg" id="heartsBg"></div>

<!-- Main card -->
<div class="card" id="mainCard">
  <span class="bear-icon" id="iconEl">🐻</span>

  <h1 id="titleEl">ใบข้าวคิดถึงผมมั้ยยย </h1>
  <p class="subtitle" id="subtitleEl">ผมคิดถึงใบข้าวมากครับ</p>

  <div class="message-box" id="messageEl">
    "อยากเจอใบข้าวอยากกอดด"
  </div>

  <div class="btn-group">
    <button class="btn-yes" onclick="onYes()">คิดถึงง</button>
    <button class="btn-no" id="noBtn" onclick="onNo()">ไม่</button>
  </div>

  <div class="response-msg" id="responseMsg"></div>
</div>


<script>
  // -------- Floating hearts --------
  const hbg = document.getElementById('heartsBg');
  const heartEmojis = ['❤️','🩷','💕','💗','💖','💝','🌸'];

  function makeHeart() {
    const h = document.createElement('span');
    h.className = 'heart-float';
    h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    h.style.left = Math.random() * 98 + 'vw';
    h.style.fontSize = (16 + Math.random() * 20) + 'px';
    const dur = 6 + Math.random() * 8;
    h.style.animationDuration = dur + 's';
    h.style.animationDelay = (Math.random() * 4) + 's';
    hbg.appendChild(h);
    setTimeout(() => h.remove(), (dur + 4) * 1000);
  }
  setInterval(makeHeart, 700);
  for (let i = 0; i < 8; i++) setTimeout(makeHeart, i * 300);

  // -------- Yes / No logic --------
  let noCount = 0;
  const noTexts = ['นะะะ', 'ทำไมล่ะครับ?', 'เธอออ', 'จริงหรออ', 'อย่าเลยยย'];

  function onYes() {
    const msg = document.getElementById('responseMsg');
    msg.style.display = 'block';
    msg.innerHTML = `<span class="burst">❤️</span> รักใบข้าวที่สุดเลยครับคนสวยของผมม <span class="burst">❤️</span>`;
    launchConfetti();
    document.querySelector('.btn-group').style.display = 'none';
  }

  function onNo() {
    noCount++;
    const btn = document.getElementById('noBtn');
    const card = document.getElementById('mainCard');
    const cr = card.getBoundingClientRect();
    const bw = btn.offsetWidth, bh = btn.offsetHeight;
    const rx = Math.random() * (cr.width - bw);
    const ry = Math.random() * (cr.height - bh);
    btn.style.position = 'absolute';
    btn.style.left = rx + 'px';
    btn.style.top  = ry + 'px';
    btn.textContent = noTexts[noCount % noTexts.length];

    const r = document.getElementById('responseMsg');
    r.style.display = 'block';
    r.innerHTML = 'เธอออย่าเลย🥺';

    const yesBtn = document.querySelector('.btn-yes');
    const scale = 1 + noCount * 0.12;
    yesBtn.style.transform = `scale(${Math.min(scale, 2)})`;
  }

  // -------- Confetti --------
  function launchConfetti() {
    const colors = ['#e83a5a','#ffd6de','#ffb3c1','#ff85a1','#c0394b','#fff0f3','#ffa0b4'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.width  = (6 + Math.random() * 8) + 'px';
      c.style.height = (6 + Math.random() * 8) + 'px';
      c.style.animationDelay = (Math.random() * 1) + 's';
      c.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }


</script>
</body>
</html>
